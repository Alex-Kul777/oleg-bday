<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>❤️ Ева и Олег</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

html { scroll-behavior: smooth; }

body {
  background: linear-gradient(180deg, #0d1b2a 0%, #1b263b 50%, #0d1b2a 100%);
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  color: white;
  width: 100%;
}

/* === HERO === */
.hero {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.hero h1 {
  font-size: clamp(2rem, 7vw, 4rem);
  background: linear-gradient(90deg, #ff6b6b, #feca57, #ff9ff3, #ff6b6b);
  background-size: 300% 100%;
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  animation: shimmer 3s linear infinite;
  font-weight: 800;
  text-align: center;
  margin-bottom: 30px;
}

@keyframes shimmer {
  0% { background-position: 0% 50%; }
  100% { background-position: 300% 50%; }
}

.scroll-hint {
  font-size: 1.3rem;
  opacity: 0.8;
  margin-bottom: 15px;
}

.scroll-arrow {
  font-size: 2.5rem;
  animation: bounce 1.5s ease-in-out infinite;
}

@keyframes bounce {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(15px); }
}

/* spacer */
.spacer { height: 40vh; }

/* === BUTTON === */
.button-section {
  min-height: 80vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.press-btn {
  padding: 25px 70px;
  font-size: 1.8rem;
  font-weight: 700;
  border: none;
  border-radius: 50px;
  background: linear-gradient(145deg, #e94560, #f368e0);
  color: white;
  cursor: pointer;
  box-shadow: 0 8px 30px rgba(233, 69, 96, 0.5);
  transition: transform 0.2s, box-shadow 0.2s;
  animation: glow 2s ease-in-out infinite;
  -webkit-tap-highlight-color: transparent;
}

@keyframes glow {
  0%, 100% { box-shadow: 0 8px 30px rgba(233, 69, 96, 0.5); }
  50% { box-shadow: 0 8px 50px rgba(243, 104, 224, 0.7); }
}

.press-btn:hover { transform: scale(1.08); }
.press-btn:active { transform: scale(0.95); }

/* === CLIP === */
.clip-overlay {
  display: none;
  position: fixed;
  top: 0; left: 0; width: 100vw; height: 100vh;
  background: black;
  z-index: 1000;
  align-items: center;
  justify-content: center;
  flex-direction: column;
}

.clip-overlay.active { display: flex; }

.slide {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  object-fit: contain;
  opacity: 0;
  transition: opacity 1.5s ease-in-out;
}

.slide.show { opacity: 1; }

.heart-float {
  position: absolute;
  font-size: 2rem;
  animation: floatUp linear forwards;
  pointer-events: none;
  z-index: 1001;
}

@keyframes floatUp {
  0% { transform: translateY(0) scale(0.5); opacity: 0; }
  20% { opacity: 1; }
  100% { transform: translateY(-100vh) scale(1.5); opacity: 0; }
}

.progress-bar {
  position: absolute;
  bottom: 0; left: 0;
  height: 4px;
  background: linear-gradient(90deg, #e94560, #f368e0);
  width: 0%;
  z-index: 1002;
}

.clip-text {
  position: absolute;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 1.5rem;
  font-weight: 700;
  z-index: 1002;
  text-shadow: 0 2px 10px rgba(0,0,0,0.8);
}

.close-btn {
  position: absolute;
  top: 20px; right: 20px;
  font-size: 2rem;
  color: white;
  cursor: pointer;
  z-index: 1003;
  opacity: 0.6;
  transition: opacity 0.2s;
}

.close-btn:hover { opacity: 1; }

.vignette {
  position: absolute;
  top: 0; left: 0; width: 100%; height: 100%;
  box-shadow: inset 0 0 150px rgba(0,0,0,0.7);
  pointer-events: none;
  z-index: 1001;
}
</style>
</head>
<body>

<div class="hero">
  <h1>❤️ Ева и Олег ❤️</h1>
  <div class="scroll-hint">листай ниже 👇</div>
  <div class="scroll-arrow">⬇️</div>
</div>

<div class="spacer"></div>

<div class="button-section">
  <button class="press-btn" onclick="startClip()">нажми 💕</button>
</div>

<div class="clip-overlay" id="clip">
  <div class="vignette"></div>
  <img class="slide" id="slide0" src="photos/1.jpg">
  <img class="slide" id="slide1" src="photos/2.jpg">
  <img class="slide" id="slide2" src="photos/3.jpg">
  <div class="clip-text" id="clipText"></div>
  <div class="progress-bar" id="progress"></div>
  <div class="close-btn" onclick="closeClip()">✕</div>
</div>

<script>
const photos = 3;
const duration = 15000;
const slideTime = duration / photos;
const captions = ["Ева и Олег", "навсегда вместе", "❤️❤️❤️"];
let clipTimer, heartTimer, progressTimer;

function startClip() {
  var clip = document.getElementById('clip');
  clip.classList.add('active');

  for (var i = 0; i < photos; i++) {
    (function(idx) {
      setTimeout(function() {
        for (var j = 0; j < photos; j++) {
          document.getElementById('slide'+j).classList.remove('show');
        }
        document.getElementById('slide'+idx).classList.add('show');
        document.getElementById('clipText').textContent = captions[idx];
      }, idx * slideTime);
    })(i);
  }

  var start = Date.now();
  progressTimer = setInterval(function() {
    var pct = Math.min(100, (Date.now() - start) / duration * 100);
    document.getElementById('progress').style.width = pct + '%';
  }, 50);

  heartTimer = setInterval(function() {
    var h = document.createElement('div');
    h.className = 'heart-float';
    h.textContent = ['❤️','💕','💗','💖','💘'][Math.floor(Math.random()*5)];
    h.style.left = Math.random() * 100 + 'vw';
    h.style.bottom = '0';
    h.style.animationDuration = (2 + Math.random() * 2) + 's';
    h.style.fontSize = (1.5 + Math.random() * 2) + 'rem';
    clip.appendChild(h);
    setTimeout(function() { h.remove(); }, 4000);
  }, 300);

  clipTimer = setTimeout(function() { closeClip(); }, duration);
}

function closeClip() {
  clearTimeout(clipTimer);
  clearInterval(heartTimer);
  clearInterval(progressTimer);
  document.getElementById('clip').classList.remove('active');
  for (var j = 0; j < photos; j++) {
    document.getElementById('slide'+j).classList.remove('show');
  }
  document.getElementById('progress').style.width = '0%';
}
</script>

</body>
</html>
